services:
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    container_name: cheeze-web
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - CONTROL_API_URL=${CONTROL_API_URL:-http://portal-api:11437}
      - ADMIN_CONTROL_TOKEN=${ADMIN_CONTROL_TOKEN}
      - SERVER_RENTAL_WEBHOOK_URL=${SERVER_RENTAL_WEBHOOK_URL:-}
      - SERVER_RENTAL_WEBHOOK_USERNAME=${SERVER_RENTAL_WEBHOOK_USERNAME:-CHEEZE Rental Intake}
    depends_on:
      portal-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - cheeze-net

  nginx:
    image: nginx:alpine
    container_name: cheeze-nginx
    network_mode: host
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /var/www/home/web/public/ccna-images:/var/www/ccna-images:ro
    depends_on:
      web:
        condition: service_healthy
      portal-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
      ai-queue:
        condition: service_healthy
    restart: unless-stopped

  portal-api:
    build:
      context: ../../deploy/gateway
      dockerfile: ../../deploy/docker/portal-api/Dockerfile
    container_name: cheeze-portal-api
    ports:
      - "127.0.0.1:11437:11437"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CHEEZE_PORTAL_LISTEN_HOST=0.0.0.0
      - CHEEZE_PORTAL_LISTEN_PORT=11437
      - CHEEZE_INTERNAL_CONTROL_BASE=http://host.docker.internal:11436
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11437/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - /opt/cheeze-control:/opt/cheeze-control
    restart: unless-stopped
    networks:
      - cheeze-net

  control-api:
    build:
      context: ../../deploy/gateway
      dockerfile: ../../deploy/docker/control-api/Dockerfile
    container_name: cheeze-control-api
    network_mode: host
    env_file:
      - .env
    environment:
      - CHEEZE_CONTROL_LISTEN_HOST=0.0.0.0
      - CHEEZE_CONTROL_LISTEN_PORT=11436
      - CHEEZE_SERVICE_REGISTRY=/app/service-registry.example.json
      - CHEEZE_BACKEND_TIMEOUT=20
      - CHEEZE_WOL_BINARY=wakeonlan
      - CHEEZE_WOL_TARGET_IP=${CHEEZE_WOL_BROADCAST:-192.168.50.255}
      - CHEEZE_BACKEND_MAC=${CHEEZE_WOL_MAC}
      - CHEEZE_BACKEND_WAKE_TIMEOUT=150
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:11436/healthz', headers={'X-Cheeze-Internal-Token': os.environ.get('CHEEZE_INTERNAL_SECRET', '')}); urllib.request.urlopen(req, timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - ../orchestrator/service-registry.example.json:/app/service-registry.example.json:ro

  ai-queue:
    build:
      context: ../../deploy/gateway
      dockerfile: ../../deploy/docker/ai-queue/Dockerfile
    container_name: cheeze-ai-queue
    ports:
      - "127.0.0.1:11435:11435"
    env_file:
      - .env
    environment:
      - CHEEZE_AI_LISTEN_HOST=0.0.0.0
      - CHEEZE_AI_LISTEN_PORT=11435
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11435/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cheeze-net

  # cloudflared runs as native systemd service (no cert.pem needed with credentials file)
  # Config: /etc/cloudflared/config.yml  ingress → http://localhost:80 (Docker nginx)

networks:
  cheeze-net:
    driver: bridge

